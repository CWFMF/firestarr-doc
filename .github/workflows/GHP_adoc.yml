name: Build and Deploy AsciiDoc Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install --prerelease asciidoctor-tabs

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/custom.css _site/

          cp -r img _site/

              asciidoctor \
                -r asciidoctor-tabs \
                docs/index.adoc \
                -o _site/index.html
      - name: Verify gems
        run: |
          gem list | grep asciidoctor
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4